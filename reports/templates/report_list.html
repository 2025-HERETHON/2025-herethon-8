<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>제보 목록</title>
</head>
<body>
    <a href="{% url 'mapview:mainmap' %}">홈으로</a>
    <h1>제보 목록</h1>

    <a href="{% url 'reports:report_create' %}">+ 제보 작성</a>

    <ul>
        {% for report in reports %}
            <li>
                <a href="{% url 'reports:report_edit' report.pk %}">
                    <strong>{{ report.title }}</strong>
                </a><br>
                작성자: {{ report.user.nickname }} |
                카테고리: {{ report.get_category_display }} |
                상태: {{ report.get_status_display }} |
                작성일: {{ report.created_at|date:"Y-m-d H:i" }}
            </li>
        {% empty %}
            <li>등록된 제보가 없습니다.</li>
        {% endfor %}
    </ul>
</body>
</html>
