<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mypage.css">
    <title>Mypage</title>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>마이페이지 </h1>
        </header>

        <main>
            <section class="profile">
                <div class="profile_image_wrap">
                    <img id="profile_image" src="" alt="">
                    <label for="user_profile" class="upload_btn">
                        <input id="user_profile" type="file" accept="image/*" placeholder="사진 업로드"/>
                        <span>이미지 업로드</span>
                    </label>
                </div>
                <div class="profile_info">
                    <h2 id="nickname">닉네임</h2>
                    <p id="email">이메일</p>
                </div>
                <div class="profile_box">
                    <button id="my_report" class="profile_btn">
                        <p>내 제보</p>
                        <span id="report_count">0</span>
                    </button>
                    <button id="my_post" class="profile_btn">
                        <p>작성한 글</p>
                        <span id="post_count">0</span>
                    </button>
                </div>
                <button id="edit_profile">프로필 수정</button>
            </section>
            <section class="setting">
                <h3>설정</h3>
                <div class="setting_detail">
                    <p>이용약관</p>
                    <p>개인정보 처리방침</p>
                    <p>문의하기</p>
                </div>
                <div class="setting_button">
                    <button id="cancel">회원탈퇴</button>
                    <button id="logout">로그아웃</button>
                </div>
            </section>
        </main>
    </div>
    <script src="mypage.js"></script>
</body>
</html>
