<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <script src="{% static 'js/login.js' %}" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-title">LOGIN</div>
        <form class="login-form" id="login-form" method="POST">
            <input type="hidden" name="csrfmiddlewaretoken" id="csrf-token">
        
            <div class="google-container">
                <img class="toGoogle-img" src="{% static 'img/google.png' %}" alt="구글"/> 
                <button type="button" class="toGoogle-btn">구글로 로그인하기</button>
            </div>
        
            <div class="form-group">
                <label for="userid">아이디</label>
                <input type="text" name="username" id="userid" required>
            </div>
        
            <div class="form-group">
                <label for="userpassword">비밀번호</label>
                <input type="password" name="password" id="userpassword" required>
            </div>
        </form>
        <div class="sign" onclick="window.location.href='/accounts/signup/'">회원가입하기</div>
        <button class="login-btn">로그인</button>
    </div>
</body>
</html>
