{% load static %}
{% include 'components/topbar.html' %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/report.css' %}">
    <script src="{% static 'js/load_components.js' %}" defer></script>
    <title>Myreport</title>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>내 제보글</h1>
        </header>
        <main>
            <div class="top">
                <div id="category_filter">
                    <p>카테고리별 필터</p>
                    <select id="category_select">
                        <option value="" selected>-----선택해주세요-----</option>
                        <option value="0">성추행/성폭력</option>
                        <option value="1">스토킹</option>
                        <option value="2">인적 드문 곳</option>
                        <option value="3">기타 위험</option>
                      </select>
                </div>

                <div class="search_wrap">
                <input type="text" id="post_search" placeholder="게시물을 검색하세요">
                <button id="search_btn">검색</button>
                </div>
            </div>

            <div id="latest_report_list" class="tab_content">
                {% if reports %}
                    {% for report in reports %}
                        <div class="content_box"
                             data-id="{{ report.id }}"
                             data-title="{{ report.title }}"
                             data-address="{{ report.address }}"
                             data-category="{{ report.get_category_display }}"
                             data-content="{{ report.content }}"
                             data-status="{{ report.get_status_display }}"
                             data-image="{% if report.photos.first %}{{ report.photos.first.image.url }}{% endif %}">
                            <div class="status">
                                <p>{{ report.get_status_display }}</p>
                            </div>
                            <div class="report_content">
                                <h2>{{ report.title }}</h2>
                                <p>{{ report.content }}</p>
                            </div>
                            <div class="report-image">
                                {% if report.photos.all %}
                                    <img src="{{ report.photos.first.image.url }}" alt="제보 이미지" />
                                {% endif %}
                            </div>
                        </div>
                    {% endfor %}
                {% else %}
                    <p>작성한 제보글이 없습니다.</p>
                {% endif %}
            </div>
        </main>
    </div>
    <script src="{% static 'js/myreport.js' %}" defer></script>
</body>
</html>
