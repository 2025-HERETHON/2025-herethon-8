<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    {% load static %}
    <script src="{% static 'js/load_components.js' %}" defer></script>
    <script src="{% static 'js/signup.js' %}" defer></script>
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
    <div class="sign-container">
        <div class="sign-title">Sign up</div>
        <form class="sign-form" id="sign-form">
            
            <div class="google-container">
            <img class=toGoogle-img src="{% static 'img/google.png' %}" alrt="구글"/> 
            <button  class="toGoogle-btn">구글로 회원가입하기</button>
            </div>

            <div class="form-group">
            <label for="user-email">이메일</label>
            <input type="email" id="user-email"  required>
            </div>

            <div class="form-group">
                <label for="user-id">아이디</label>
                <input type="text" id="user-id"  required>
                </div>

            <div class="form-group">
            <label for="user-password">비밀번호</label>
            <input type="password" id="user-password"  required>
            </div>

            <div class="form-group">
                <label for="user-password-confirm">비밀번호 확인</label>
                <input type="password" id="user-password-confirm"  required>
                </div>
            
            <div class="form-group">
                    <label for="user-nickname">닉네임</label>
                    <input type="text" id="user-nickname"  required>
            </div>
            <button type="submit" class="sign-btn">회원가입</button>
        </form>
       
    </div>
</body>
</html>
