<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>커뮤니티 게시판</title>
</head>
<body>
    <a href="{% url 'mapview:mainmap' %}">홈으로</a>  <a href="{% url 'community:post_create' %}"> 새 글 작성</a>
    <h1>커뮤니티 게시글 목록</h1><hr>

    {% for post in posts %}
        <div>
            <p>postId: {{ post.id }}</p>
            <h3>
                <a href="{% url 'community:post_detail' post.pk %}">{{ post.title }}</a>
            </h3>
            <p>{{ post.content }}</p>
            <p>작성자: {{ post.user.nickname }} | 작성일: {{ post.created_at|date:"Y-m-d H:i" }}</p>
            <p>조회수: {{ post.views }} | 좋아요: {{ post.like.count }}</p>
            <hr>
        </div>
    {% empty %}
        <p>작성된 게시글이 없습니다.</p>
    {% endfor %}
</body>
</html>
