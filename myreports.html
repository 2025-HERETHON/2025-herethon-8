<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="myreports.css">
    <title>myreports</title>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>내 제보글</h1>
        </header>
        <main>
            <div class="filter">
            <div id="category_filter">
                <p>카테고리별 필터</p>
                 <select>
                    <option value="" disabled selected>-----선택해주세요-----</option>
                    <option value="sexual_harassment">성추행/성폭력</option>
                    <option value="stalking">스토킹</option>
                    <option value="corner">인적 드문 곳</option>
                    <option value="other">기타위험</option>
                </select>
            </div>
            <div class="search_wrap">
            <input type="text" id="post_search" placeholder="게시물을 검색하세요">
            <button id="search_btn">검색</button>
            </div>
            </div>
            <div class="content_box">
                <div class="status">
                    <p>검토중</p>
                </div>
                <div class="report_content">
                    <h2>강남역에 이상한 사람이 있어요</h2>
                    <p>어제 밤 11시쯤 강남역에서 집까지 걸어갔는데, 이상한 사람이 있었습니다.</p>
                    <div class="report_footer">
                        <span id="like-btn">도움이 돼요 <span id="like-count">0</span> </span>
                        <span id="comment-btn">댓글 <span id="comment-count">0</span> </span>
                    </div>
                </div>
                <div class="report-image"></div>
            </div>
        </main>
    </div>
</body>
</html>
